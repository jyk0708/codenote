# 本地开发环境配置
# 启动命令：mvn spring-boot:run -Dspring-boot.run.profiles=local

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/codenote
spring.datasource.username=postgres
spring.datasource.password=postgres

# JWT
jwt.secret=local-dev-secret-key-must-be-at-least-32-characters-long-ok
jwt.expiration-ms=86400000

# CORS
cors.allowed-origins=*

# MinIO
minio.endpoint=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket-name=codenote

# Logging
logging.level.com.codenote=DEBUG
logging.level.org.springframework.security=INFO
