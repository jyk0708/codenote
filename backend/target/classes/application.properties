spring.application.name=codenote-backend

# Server
server.port=8080
server.servlet.context-path=/api

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://192.168.1.109:5432/codenote
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# JWT
jwt.secret=your-256-bit-secret-key-here-must-be-at-least-32-characters-long
jwt.expiration-ms=86400000

# CORS
cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:3002

# MinIO
minio.endpoint=http://192.168.1.109:9000
minio.access-key=admin
minio.secret-key=12345678
minio.bucket-name=codenote

# Logging
logging.level.com.codenote=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
